<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Information System – Manage student data seamlessly and efficiently.">
    <title>Student Information System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #141E30 0%, #243B55 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            width: 100%;
            max-width: 800px;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 201, 167, 0.15);
            border: 1px solid rgba(0, 201, 167, 0.4);
            color: #00C9A7;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 1.5rem;
            animation: fadeIn 1.2s ease;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 4rem);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 1rem;
            line-height: 1.2;
            letter-spacing: 0.02em;
            animation: fadeUp 1s ease-in-out 0.2s both;
        }

        h1 span {
            color: #00C9A7;
        }

        p {
            font-size: clamp(0.95rem, 2vw, 1.2rem);
            margin-bottom: 2.5rem;
            opacity: 0.75;
            animation: fadeUp 1s ease-in-out 0.4s both;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp 1s ease-in-out 0.6s both;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            color: #141E30;
            background: #00C9A7;
            border: none;
            border-radius: 50px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: 0.04em;
        }

        .btn:hover {
            background: #00E5FF;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 201, 167, 0.35);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .arrow {
            display: inline-block;
            width: 8px;
            height: 8px;
            border: solid currentColor;
            border-width: 0 2px 2px 0;
            transform: rotate(-45deg);
            transition: transform 0.3s;
        }

        .btn:hover .arrow {
            transform: rotate(-45deg) translateX(3px) translateY(-3px);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 4rem;
            flex-wrap: wrap;
            animation: fadeUp 1s ease-in-out 0.8s both;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 700;
            color: #00C9A7;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 4px;
        }

        .divider {
            width: 1px;
            height: 40px;
            background: rgba(255,255,255,0.15);
            align-self: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .divider { display: none; }
            .stats { gap: 24px; }
            .btn-group { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 280px; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Pokhara University · NCIT</div>
        <h1>Student <span>Information</span> System</h1>
        <p>Manage student data seamlessly and efficiently — from attendance to grades, all in one place.</p>
        <div class="btn-group">
            <a href="login1.html" class="btn">
                Get Started
                <span class="arrow"></span>
            </a>
            <a href="main.html" class="btn btn-outline">Explore Features</a>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="stat-value">500+</div>
                <div class="stat-label">Students</div>
            </div>
            <div class="divider"></div>
            <div class="stat">
                <div class="stat-value">6</div>
                <div class="stat-label">Modules</div>
            </div>
            <div class="divider"></div>
            <div class="stat">
                <div class="stat-value">24/7</div>
                <div class="stat-label">Access</div>
            </div>
        </div>
    </div>
</body>
</html>
